name: Release RPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: tumbleweed
            image: opensuse/tumbleweed
          - distro: leap
            image: docker.io/opensuse/leap:16.0
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            cmake \
            gcc-c++ \
            git \
            qt6-core-devel \
            qt6-gui-devel \
            qt6-quick-devel \
            qt6-quickcontrols2-devel \
            qt6-linguist-devel \
            rpm-build \
            snappy-devel \
            zlib-devel \
            libbz2-devel \
            liblz4-devel \
            libzstd-devel \
            liburing2-devel \
            gflags-devel

      - name: Build and install RocksDB
        run: |
          git clone --depth 1 --branch v11.1.1 https://github.com/facebook/rocksdb.git /tmp/rocksdb
          cd /tmp/rocksdb
          sed -i 's/-Werror/-Wno-error/g' CMakeLists.txt
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j$(nproc)
          cmake --install build
          ldconfig
          # Verify installation location
          ls -la /usr/local/lib64/librocksdb.so* 2>/dev/null || ls -la /usr/local/lib/librocksdb.so*

      - name: Configure RocksDBViewer
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr \
            -DROCKSDB_ROOT=/usr/local

      - name: Build RocksDBViewer
        run: cmake --build build -j$(nproc)

      - name: Generate RPM package
        run: |
          cd build
          cpack -G RPM
          # Rename artifact to include tag and distro name
          mv RocksDBViewer-*.rpm "../RocksDBViewer-${{ github.ref_name }}-${{ matrix.distro }}.x86_64.rpm"

      - name: Upload RPM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RocksDBViewer-*.rpm
