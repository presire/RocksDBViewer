name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract and validate version
        id: version
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(grep -oP 'project\(RocksDBViewer VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "$tag_ver" != "$cmake_ver" ]; then
            echo "::error::Tag version ($tag_ver) does not match CMakeLists.txt version ($cmake_ver)"
            exit 1
          fi
          echo "VERSION=$tag_ver" >> "$GITHUB_OUTPUT"
          echo "Version: $tag_ver"

  build-rpm-tumbleweed:
    needs: validate
    runs-on: ubuntu-latest
    container:
      # tag: latest, digest looked up on 2026-10-05
      image: opensuse/tumbleweed@sha256:db7d09c264b72eb95655deb7a696a64d65a0159d1dfb0a4d703347669c709e44
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            cmake gcc-c++ git rpm-build \
            qt6-core-devel qt6-gui-devel qt6-quick-devel \
            qt6-quickcontrols2-devel qt6-linguist-devel \
            snappy-devel zlib-devel libbz2-devel liblz4-devel \
            libzstd-devel liburing2-devel gflags-devel

      - name: Build RocksDB
        run: |
          git clone --depth 1 --branch v11.1.1 https://github.com/facebook/rocksdb.git /tmp/rocksdb
          test "$(git -C /tmp/rocksdb rev-parse HEAD)" = "6cdeb9d9d0630763327f512e6255cab33f6834e7" || { echo "RocksDB commit mismatch"; exit 1; }
          cmake -S /tmp/rocksdb -B /tmp/rocksdb/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DFAIL_ON_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/rocksdb/build --parallel $(nproc)
          cmake --install /tmp/rocksdb/build
          ldconfig || true

      - name: Build RocksDBViewer
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DROCKSDB_ROOT=/usr/local
          cmake --build build --parallel $(nproc)

      - name: Package RPM
        run: |
          cd build
          cpack -G RPM

      - name: Rename artifact
        run: |
          cd build
          for f in *.rpm; do
            mv "$f" "RocksDBViewer-${{ needs.validate.outputs.version }}-tumbleweed.x86_64.rpm"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RocksDBViewer-${{ needs.validate.outputs.version }}-tumbleweed.x86_64.rpm
          path: build/*.rpm

  build-rpm-leap16:
    needs: validate
    runs-on: ubuntu-latest
    container:
      # tag: 16.0, digest looked up on 2026-10-05
      image: opensuse/leap@sha256:7f3aeccb6a613c0fc1690d3d3e5eb493fd477ee4587de20640017fc36d72f9b0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            cmake gcc-c++ git rpm-build \
            qt6-core-devel qt6-gui-devel qt6-quick-devel \
            qt6-quickcontrols2-devel qt6-linguist-devel \
            snappy-devel zlib-devel libbz2-devel liblz4-devel \
            libzstd-devel liburing2-devel gflags-devel

      - name: Build RocksDB
        run: |
          git clone --depth 1 --branch v11.1.1 https://github.com/facebook/rocksdb.git /tmp/rocksdb
          test "$(git -C /tmp/rocksdb rev-parse HEAD)" = "6cdeb9d9d0630763327f512e6255cab33f6834e7" || { echo "RocksDB commit mismatch"; exit 1; }
          cmake -S /tmp/rocksdb -B /tmp/rocksdb/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DFAIL_ON_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/rocksdb/build --parallel $(nproc)
          cmake --install /tmp/rocksdb/build
          ldconfig || true

      - name: Build RocksDBViewer
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DROCKSDB_ROOT=/usr/local
          cmake --build build --parallel $(nproc)

      - name: Package RPM
        run: |
          cd build
          cpack -G RPM

      - name: Rename artifact
        run: |
          cd build
          for f in *.rpm; do
            mv "$f" "RocksDBViewer-${{ needs.validate.outputs.version }}-leap16.x86_64.rpm"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RocksDBViewer-${{ needs.validate.outputs.version }}-leap16.x86_64.rpm
          path: build/*.rpm

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Ninja
        run: choco install ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # 6.9.x does not receive open-source security fixes (CVE-2025-12385, CVE-2026-6210, ...).
          version: '6.11.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          # aqtinstall 3.3.0 (latest PyPI release) cannot resolve the per-compiler Windows
          # repository layout introduced in Qt 6.11 (fixed by miurahr/aqtinstall#1000, unreleased).
          # Pinned to an audited master commit; switch back to aqtversion once a release ships.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Build RocksDB
        shell: powershell
        run: |
          git clone --depth 1 --branch v11.1.1 https://github.com/facebook/rocksdb.git C:\rocksdb-src
          $head = (git -C C:\rocksdb-src rev-parse HEAD).Trim()
          if ($head -ne "6cdeb9d9d0630763327f512e6255cab33f6834e7") { Write-Error "RocksDB commit mismatch"; exit 1 }
          cmake -S C:\rocksdb-src -B C:\rocksdb-src\build `
            -G "Ninja Multi-Config" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWITH_TESTS=OFF `
            -DWITH_TOOLS=OFF `
            -DROCKSDB_BUILD_SHARED=OFF `
            -DPORTABLE=1 `
            -DROCKSDB_INSTALL_ON_WINDOWS=ON `
            -DCMAKE_INSTALL_PREFIX=C:\rocksdb-install `
            -DWITH_GFLAGS=OFF `
            -DWITH_JEMALLOC=OFF `
            -DFAIL_ON_WARNINGS=OFF
          cmake --build C:\rocksdb-src\build --config Release
          cmake --install C:\rocksdb-src\build --config Release

      - name: Build RocksDBViewer
        shell: powershell
        run: |
          cmake -B build -S . -G "Ninja Multi-Config" `
            -DCMAKE_BUILD_TYPE=Release `
            -DROCKSDB_ROOT=C:\rocksdb-install
          cmake --build build --config Release

      - name: Deploy Qt dependencies
        shell: powershell
        run: |
          mkdir deploy
          cp build\Release\RocksDBViewer.exe deploy\
          windeployqt --release --qmldir .\qml --no-translations --no-compiler-runtime deploy\RocksDBViewer.exe

      - name: Package ZIP
        shell: powershell
        run: |
          Compress-Archive -Path deploy\* -DestinationPath RocksDBViewer-${{ needs.validate.outputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RocksDBViewer-${{ needs.validate.outputs.version }}-windows-x64.zip
          path: RocksDBViewer-${{ needs.validate.outputs.version }}-windows-x64.zip

  release:
    needs: [validate, build-rpm-tumbleweed, build-rpm-leap16, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RocksDBViewer ${{ needs.validate.outputs.version }}" \
            --generate-notes \
            artifacts/*
